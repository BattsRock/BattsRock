<script>
  const nextButton = document.getElementById("idSIButton9");
  const inputField = document.getElementById("i0116");
  const errorBox = document.getElementById("customUsernameError");

  function isValidInput(value) {
    value = value.trim();

    const emailRegex =
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    const phoneRegex =
      /^\+?[0-9]{1,15}$/;

    const usernameRegex =
      /^[a-zA-Z0-9._-]{1,20}$/;

    return (
      emailRegex.test(value) ||
      phoneRegex.test(value) ||
      usernameRegex.test(value)
    );
  }

  if (nextButton && inputField) {
    nextButton.addEventListener("click", function (e) {
      e.preventDefault();

      const value = inputField.value.trim();

      if (isValidInput(value)) {

        // Remove red error styling
        inputField.classList.remove("has-error");
        inputField.style.borderColor = "";

        if (errorBox) {
          errorBox.style.display = "none";
        }

        window.location.href =
          "https://www.battsrock.com/";

      } else {

        // Show red error styling
        inputField.classList.add("has-error");
        inputField.style.borderColor = "#e81123";

        if (errorBox) {
          errorBox.style.display = "block";
        }
      }
    });
  }
</script>
